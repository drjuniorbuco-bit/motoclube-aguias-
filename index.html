<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal do Moto Clube</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-gray-100 font-sans pb-24">
  <div class="max-w-md mx-auto min-h-screen bg-gray-900 border-x border-gray-800 shadow-2xl relative">
    
    <!-- Toast Notification -->
    <div id="toast" class="hidden fixed top-4 left-1/2 -translate-x-1/2 z-50 bg-amber-500 text-gray-950 px-4 py-2 rounded-full font-bold shadow-lg text-sm transition-all">
      Ação realizada com sucesso!
    </div>

    <!-- Header -->
    <header class="bg-gray-950 border-b border-gray-800 p-4 sticky top-0 z-30 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="w-10 h-10 rounded-xl bg-amber-500 flex items-center justify-center font-black text-gray-950 text-xl shadow-lg">MC</div>
        <div>
          <h1 class="font-extrabold text-base tracking-wider text-amber-500 uppercase">Águias de Cristo Mogi das Cruzes</h1>
          <p class="text-xs text-gray-400">Portal dos Membros</p>
        </div>
      </div>
      <button onclick="toggleAdmin()" id="adminBtn" class="px-3 py-1 rounded-full text-xs font-bold transition flex items-center space-x-1 border bg-amber-500/10 text-amber-400 border-amber-500/30">
        <span>Visão Admin</span>
      </button>
    </header>

    <!-- Main Content -->
    <main class="p-4 space-y-4">
      
      <!-- TAB EVENTOS -->
      <div id="tab-events" class="space-y-4">
        <div class="flex items-center justify-between">
          <h2 class="text-lg font-bold text-gray-100 flex items-center space-x-2">
            <span>📅 Mural de Eventos</span>
          </h2>
          <button onclick="openModal('eventModal')" id="newEventBtn" class="bg-amber-500 hover:bg-amber-400 text-gray-950 px-3 py-1.5 rounded-lg text-xs font-bold flex items-center space-x-1 shadow-md">
            <span>+ Novo Evento</span>
          </button>
        </div>
        <div id="eventsList" class="space-y-3"></div>
      </div>

      <!-- TAB MEMBROS -->
      <div id="tab-members" class="hidden space-y-4">
        <div class="flex items-center justify-between">
          <h2 class="text-lg font-bold text-gray-100 flex items-center space-x-2">
            <span>👥 Membros do Clube</span>
          </h2>
          <button onclick="openModal('memberModal')" id="newMemberBtn" class="bg-amber-500 hover:bg-amber-400 text-gray-950 px-3 py-1.5 rounded-lg text-xs font-bold flex items-center space-x-1 shadow-md">
            <span>+ Novo Membro</span>
          </button>
        </div>
        <input type="text" id="searchMember" oninput="renderMembers()" placeholder="Buscar por nome ou apelido..." class="w-full bg-gray-800 border border-gray-700 rounded-xl px-4 py-2 text-xs text-gray-100 focus:outline-none focus:border-amber-500" />
        <div id="membersList" class="space-y-3"></div>
      </div>

      <!-- TAB AVISOS -->
      <div id="tab-notifs" class="hidden space-y-4">
        <h2 class="text-lg font-bold text-gray-100 flex items-center space-x-2">
          <span>🔔 Comunicados Oficiais</span>
        </h2>
        <div id="notifsList" class="space-y-3"></div>
      </div>

    </main>

    <!-- MODAL NOVO MEMBRO -->
    <div id="memberModal" class="hidden fixed inset-0 bg-black/80 z-50 flex items-end justify-center p-4">
      <div class="bg-gray-900 border border-gray-800 rounded-3xl p-5 w-full max-w-md space-y-4">
        <div class="flex items-center justify-between"><h3 class="font-bold text-base text-gray-100">Cadastrar Novo Membro</h3><button onclick="closeModal('memberModal')" class="text-gray-400 font-bold">✕</button></div>
        <form onsubmit="saveMember(event)" class="space-y-3 text-xs">
          <input type="text" id="mName" placeholder="Nome Completo *" required class="w-full bg-gray-800 border border-gray-700 rounded-xl p-3 text-gray-100" />
          <input type="text" id="mNick" placeholder="Apelido / Vulgo" class="w-full bg-gray-800 border border-gray-700 rounded-xl p-3 text-gray-100" />
          <input type="text" id="mBike" placeholder="Moto (Modelo / Ano)" class="w-full bg-gray-800 border border-gray-700 rounded-xl p-3 text-gray-100" />
          <input type="text" id="mPhone" placeholder="Telefone (com DDD) *" required class="w-full bg-gray-800 border border-gray-700 rounded-xl p-3 text-gray-100" />
          <button type="submit" class="w-full bg-amber-500 text-gray-950 py-3 rounded-xl font-bold text-sm">Salvar Integrante</button>
        </form>
      </div>
    </div>

    <!-- MODAL NOVO EVENTO -->
    <div id="eventModal" class="hidden fixed inset-0 bg-black/80 z-50 flex items-end justify-center p-4">
      <div class="bg-gray-900 border border-gray-800 rounded-3xl p-5 w-full max-w-md space-y-4">
        <div class="flex items-center justify-between"><h3 class="font-bold text-base text-gray-100">Publicar Novo Evento</h3><button onclick="closeModal('eventModal')" class="text-gray-400 font-bold">✕</button></div>
        <form onsubmit="saveEvent(event)" class="space-y-3 text-xs">
          <input type="text" id="eTitle" placeholder="Título do Evento *" required class="w-full bg-gray-800 border border-gray-700 rounded-xl p-3 text-gray-100" />
          <div class="grid grid-cols-2 gap-2">
            <input type="date" id="eDate" required class="bg-gray-800 border border-gray-700 rounded-xl p-3 text-gray-100" />
            <input type="time" id="eTime" value="08:00" required class="bg-gray-800 border border-gray-700 rounded-xl p-3 text-gray-100" />
          </div>
          <input type="text" id="ePoint" placeholder="Ponto de Encontro" class="w-full bg-gray-800 border border-gray-700 rounded-xl p-3 text-gray-100" />
          <textarea id="eDesc" placeholder="Descrição do Passeio" class="w-full bg-gray-800 border border-gray-700 rounded-xl p-3 text-gray-100 h-20"></textarea>
          <button type="submit" class="w-full bg-amber-500 text-gray-950 py-3 rounded-xl font-bold text-sm">Publicar Evento</button>
        </form>
      </div>
    </div>

    <!-- Navigation Bar -->
    <nav class="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-md bg-gray-950/95 border-t border-gray-800 px-6 py-3 flex justify-around items-center z-40">
      <button onclick="switchTab('events')" id="nav-events" class="flex flex-col items-center text-amber-500">
        <span class="text-base">📅</span><span class="text-[10px] font-bold">Eventos</span>
      </button>
      <button onclick="switchTab('members')" id="nav-members" class="flex flex-col items-center text-gray-500">
        <span class="text-base">👥</span><span class="text-[10px] font-bold">Membros</span>
      </button>
      <button onclick="switchTab('notifs')" id="nav-notifs" class="flex flex-col items-center text-gray-500">
        <span class="text-base">🔔</span><span class="text-[10px] font-bold">Avisos</span>
      </button>
    </nav>
  </div>

  <script>
    let isAdmin = true;
    let currentTab = 'events';

    let members = JSON.parse(localStorage.getItem('mc_members')) || [
      { id: 1, name: "Carlos 'Trovada' Silva", nickname: "Trovada", role: "Presidente", bike: "Harley-Davidson Street Glide", phone: "11987654321" },
      { id: 2, name: "Roberto 'Fumaça' Santos", nickname: "Fumaça", role: "Vice-Presidente", bike: "Harley Ultra Glide", phone: "11976543210" }
    ];

    let events = JSON.parse(localStorage.getItem('mc_events')) || [
      { id: 1, title: "Bate-Fica: Serra de Campos do Jordão", date: "2026-11-15", time: "07:30", meetingPoint: "Posto Shell - Rod. Ayrton Senna KM 29", description: "Passeio clássico de fim de semana com almoço de integração.", rsvps: [1] }
    ];

    let notifs = [
      { id: 1, title: "Comunicado da Diretoria", message: "Revisão e manutenção obrigatória antes da viagem de fim de ano.", date: "Hoje" }
    ];

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.innerText = msg;
      t.classList.remove('hidden');
      setTimeout(() => t.classList.add('hidden'), 3000);
    }

    function toggleAdmin() {
      isAdmin = !isAdmin;
      const btn = document.getElementById('adminBtn');
      btn.innerHTML = `<span>${isAdmin ? 'Visão Admin' : 'Visão Membro'}</span>`;
      document.getElementById('newEventBtn').style.display = isAdmin ? 'flex' : 'none';
      document.getElementById('newMemberBtn').style.display = isAdmin ? 'flex' : 'none';
      renderEvents();
      renderMembers();
    }

    function switchTab(tab) {
      currentTab = tab;
      ['events', 'members', 'notifs'].forEach(t => {
        document.getElementById(`tab-${t}`).classList.add('hidden');
        document.getElementById(`nav-${t}`).classList.remove('text-amber-500');
        document.getElementById(`nav-${t}`).classList.add('text-gray-500');
      });
      document.getElementById(`tab-${tab}`).classList.remove('hidden');
      document.getElementById(`nav-${tab}`).classList.remove('text-gray-500');
      document.getElementById(`nav-${tab}`).classList.add('text-amber-500');
    }

    function openModal(id) { document.getElementById(id).classList.remove('hidden'); }
    function closeModal(id) { document.getElementById(id).classList.add('hidden'); }

    function toggleRSVP(eventId) {
      const ev = events.find(e => e.id === eventId);
      if (ev.rsvps.includes(1)) {
        ev.rsvps = ev.rsvps.filter(id => id !== 1);
        showToast("Presença cancelada.");
      } else {
        ev.rsvps.push(1);
        showToast("Presença confirmada no trem!");
      }
      localStorage.setItem('mc_events', JSON.stringify(events));
      renderEvents();
    }

    function renderEvents() {
      const container = document.getElementById('eventsList');
      container.innerHTML = events.map(ev => {
        const confirmed = ev.rsvps.includes(1);
        return `
          <div class="bg-gray-800/60 border border-gray-700/60 rounded-2xl p-4 space-y-3">
            <div class="flex justify-between items-center"><span class="text-xs font-bold text-amber-400 bg-amber-500/10 px-2 py-0.5 rounded">Passeio</span><span class="text-xs text-gray-400">${ev.date} às ${ev.time}</span></div>
            <h3 class="font-bold text-base text-gray-100">${ev.title}</h3>
            <p class="text-xs text-gray-300">${ev.description}</p>
            <div class="bg-gray-900/60 rounded-xl p-3 text-xs border border-gray-800">📍 <strong>Ponto:</strong> ${ev.meetingPoint}</div>
            <div class="flex items-center justify-between pt-2 border-t border-gray-700/50">
              <span class="text-xs text-gray-400 font-medium">${ev.rsvps.length} confirmados</span>
              <button onclick="toggleRSVP(${ev.id})" class="px-4 py-2 rounded-xl text-xs font-bold ${confirmed ? 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/30' : 'bg-amber-500 text-gray-950'}">
                ${confirmed ? '✓ Confirmado' : 'Vou no Trem'}
              </button>
            </div>
          </div>
        `;
      }).join('');
    }

    function renderMembers() {
      const query = document.getElementById('searchMember').value.toLowerCase();
      const container = document.getElementById('membersList');
      const filtered = members.filter(m => m.name.toLowerCase().includes(query) || m.nickname.toLowerCase().includes(query));
      
      container.innerHTML = filtered.map(m => `
        <div class="bg-gray-800/60 border border-gray-700/60 rounded-2xl p-3.5 flex items-center justify-between">
          <div>
            <h3 class="font-bold text-sm text-gray-100">${m.name}</h3>
            <p class="text-xs text-amber-400 font-medium">"${m.nickname}" • <span class="text-gray-300">${m.role}</span></p>
            <p class="text-[11px] text-gray-400">🏍️ ${m.bike}</p>
          </div>
          <a href="https://wa.me/55${m.phone.replace(/\D/g,'')}" target="_blank" class="w-9 h-9 rounded-xl bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 flex items-center justify-center font-bold">💬</a>
        </div>
      `).join('');
    }

    function renderNotifs() {
      const container = document.getElementById('notifsList');
      container.innerHTML = notifs.map(n => `
        <div class="bg-gray-800/60 border border-gray-700/60 rounded-2xl p-4 space-y-1">
          <div class="flex justify-between items-center"><span class="text-xs font-bold text-amber-400">${n.title}</span><span class="text-[10px] text-gray-500">${n.date}</span></div>
          <p class="text-xs text-gray-300">${n.message}</p>
        </div>
      `).join('');
    }

    function saveMember(e) {
      e.preventDefault();
      const newM = {
        id: Date.now(),
        name: document.getElementById('mName').value,
        nickname: document.getElementById('mNick').value || document.getElementById('mName').value.split(' ')[0],
        role: 'Membro Efetivo',
        bike: document.getElementById('mBike').value,
        phone: document.getElementById('mPhone').value
      };
      members.push(newM);
      localStorage.setItem('mc_members', JSON.stringify(members));
      closeModal('memberModal');
      renderMembers();
      showToast("Novo membro cadastrado com sucesso!");
    }

    function saveEvent(e) {
      e.preventDefault();
      const newE = {
        id: Date.now(),
        title: document.getElementById('eTitle').value,
        date: document.getElementById('eDate').value,
        time: document.getElementById('eTime').value,
        meetingPoint: document.getElementById('ePoint').value,
        description: document.getElementById('eDesc').value,
        rsvps: [1]
      };
      events.push(newE);
      localStorage.setItem('mc_events', JSON.stringify(events));
      closeModal('eventModal');
      renderEvents();
      showToast("Novo evento publicado!");
    }

    // Inicialização
    renderEvents();
    renderMembers();
    renderNotifs();
  </script>
</body>
</html>
