<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal do Moto Clube</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://unpkg.com/lucide-react/dist/umd/lucide-react.js"></script>
</head>
<body class="bg-gray-900 text-gray-100">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;
    const { Users, Calendar, Bell, Shield, Plus, CheckCircle2, MapPin, Phone, Bike, Search, Check, X, Send, UserCheck, AlertTriangle, ChevronRight, Hash, Star } = lucide;

    const INITIAL_MEMBERS = [
      { id: 1, name: "Carlos 'Trovada' Silva", nickname: "Trovada", role: "Presidente", bike: "Harley-Davidson Street Glide Special 114", phone: "(11) 98765-4321", status: "Ativo", avatar: "https://images.unsplash.com/photo-1568602471122-7832951cc4c5?w=200&auto=format&fit=crop&q=80", joinedDate: "2018" },
      { id: 2, name: "Roberto 'Fumaça' Santos", nickname: "Fumaça", role: "Vice-Presidente", bike: "Harley-Davidson Ultra Glide Limited", phone: "(11) 97654-3210", status: "Ativo", avatar: "https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=200&auto=format&fit=crop&q=80", joinedDate: "2019" },
      { id: 3, name: "Mariana 'Asa' Oliveira", nickname: "Asa", role: "Capitã de Estrada", bike: "BMW R 1250 GS Adventure", phone: "(11) 96543-2109", status: "Ativo", avatar: "https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=200&auto=format&fit=crop&q=80", joinedDate: "2021" },
      { id: 4, name: "Lucas 'Escorpião' Mendes", nickname: "Escorpião", role: "Membro Efetivo", bike: "Triumph Tiger 900 GT Pro", phone: "(11) 95432-1098", status: "Ativo", avatar: "https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=200&auto=format&fit=crop&q=80", joinedDate: "2023" }
    ];

    const INITIAL_EVENTS = [
      { id: 1, title: "Bate-Fica: Serra de Campos do Jordão", date: "2026-11-15", time: "07:30", meetingPoint: "Posto Shell - Rod. Ayrton Senna KM 29", destination: "Campos do Jordão - SP", description: "Passeio clássico de fim de semana pela serra com almoço de integração no Morro do Elefante. Trajeto total de 340km (bate e fica).", rsvps: [1, 2, 3], category: "Passeio", urgent: false },
      { id: 2, title: "Reunião Mensal & Churrasco de Integração", date: "2026-11-20", time: "19:30", meetingPoint: "Sede Oficial do Moto Clube", destination: "Sede MC", description: "Alinhamento das viagens oficiais do 1º trimestre de 2027, votação de brasões para novos prospectos e prestação de contas.", rsvps: [1, 2, 4], category: "Reunião", urgent: true }
    ];

    const INITIAL_NOTIFICATIONS = [
      { id: 1, title: "Comunicado da Diretoria", message: "Lembrete: Atualização do exame de saúde e manutenção das motos obrigatórias antes do trem de fim de ano.", date: "Hoje às 10:30", type: "alert" },
      { id: 2, title: "Novo Evento Confirmado!", message: "Comboio 'Serra de Campos do Jordão' publicado. Confirme sua participação no mural de eventos.", date: "Ontem às 18:00", type: "event" }
    ];

    function App() {
      const [activeTab, setActiveTab] = useState('events');
      const [isAdmin, setIsAdmin] = useState(true);
      const [members, setMembers] = useState(() => {
        const saved = localStorage.getItem('mc_members');
        return saved ? JSON.parse(saved) : INITIAL_MEMBERS;
      });
      const [events, setEvents] = useState(() => {
        const saved = localStorage.getItem('mc_events');
        return saved ? JSON.parse(saved) : INITIAL_EVENTS;
      });
      const [notifications, setNotifications] = useState(() => {
        const saved = localStorage.getItem('mc_notifs');
        return saved ? JSON.parse(saved) : INITIAL_NOTIFICATIONS;
      });

      const currentUserId = 1;
      const [isAddMemberOpen, setIsAddMemberOpen] = useState(false);
      const [isAddEventOpen, setIsAddEventOpen] = useState(false);
      const [isBroadcastOpen, setIsBroadcastOpen] = useState(false);
      const [searchTerm, setSearchTerm] = useState('');
      const [categoryFilter, setCategoryFilter] = useState('Todos');

      const [newMember, setNewMember] = useState({ name: '', nickname: '', role: 'Membro Efetivo', bike: '', phone: '', avatar: '' });
      const [newEvent, setNewEvent] = useState({ title: '', date: '', time: '08:00', meetingPoint: '', destination: '', description: '', category: 'Passeio', urgent: false });
      const [broadcastMsg, setBroadcastMsg] = useState({ title: '', message: '' });
      const [toast, setToast] = useState('');

      const showToast = (msg) => { setToast(msg); setTimeout(() => setToast(''), 3000); };

      useEffect(() => { localStorage.setItem('mc_members', JSON.stringify(members)); }, [members]);
      useEffect(() => { localStorage.setItem('mc_events', JSON.stringify(events)); }, [events]);
      useEffect(() => { localStorage.setItem('mc_notifs', JSON.stringify(notifications)); }, [notifications]);

      const toggleRSVP = (eventId) => {
        setEvents(prev => prev.map(ev => {
          if (ev.id === eventId) {
            const hasConfirmed = ev.rsvps.includes(currentUserId);
            const newRsvps = hasConfirmed ? ev.rsvps.filter(id => id !== currentUserId) : [...ev.rsvps, currentUserId];
            showToast(hasConfirmed ? "Presença cancelada no evento." : "Presença confirmada no trem!");
            return { ...ev, rsvps: newRsvps };
          }
          return ev;
        }));
      };

      const handleAddMember = (e) => {
        e.preventDefault();
        if (!newMember.name || !newMember.phone) return;
        const added = { id: Date.now(), ...newMember, nickname: newMember.nickname || newMember.name.split(' ')[0], status: 'Ativo', avatar: newMember.avatar || 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=200&auto=format&fit=crop&q=80', joinedDate: new Date().getFullYear().toString() };
        setMembers([added, ...members]);
        setIsAddMemberOpen(false);
        setNewMember({ name: '', nickname: '', role: 'Membro Efetivo', bike: '', phone: '', avatar: '' });
        showToast("Novo integrante cadastrado!");
      };

      const handleAddEvent = (e) => {
        e.preventDefault();
        if (!newEvent.title || !newEvent.date) return;
        const adicionado = { id: Date.now(), ...newEvent, rsvps: [currentUserId] };
        setEvents([adicionado, ...events]);
        setIsAddEventOpen(false);
        setNewEvent({ title: '', date: '', time: '08:00', meetingPoint: '', destination: '', description: '', category: 'Passeio', urgent: false });
        setNotifications([{ id: Date.now(), title: `Novo Evento: ${adicionado.title}`, message: `Programado para ${adicionado.date} às ${adicionado.time}. Confirme sua presença no mural.`, date: "Agora mesmo", type: 'event' }, ...notifications]);
        showToast("Novo evento publicado!");
      };

      const handleSendBroadcast = (e) => {
        e.preventDefault();
        if (!broadcastMsg.title || !broadcastMsg.message) return;
        const notif = { id: Date.now(), title: broadcastMsg.title, message: broadcastMsg.message, date: "Agora mesmo", type: 'alert' };
        setNotifications([notif, ...notifications]);
        setIsBroadcastOpen(false);
        setBroadcastMsg({ title: '', message: '' });
        showToast("Comunicado enviado a todos os membros!");
      };

      const filteredMembers = members.filter(m => m.name.toLowerCase().includes(searchTerm.toLowerCase()) || m.nickname.toLowerCase().includes(searchTerm.toLowerCase()) || m.bike.toLowerCase().includes(searchTerm.toLowerCase()));
      const filteredEvents = events.filter(ev => categoryFilter === 'Todos' || ev.category === categoryFilter);

      return (
        <div class="min-h-screen pb-20 max-w-md mx-auto bg-gray-900 border-x border-gray-800 shadow-2xl relative">
          {toast && (
            <div class="fixed top-4 left-1/2 -translate-x-1/2 z-50 bg-amber-500 text-gray-950 px-4 py-2 rounded-full font-bold shadow-lg flex items-center space-x-2 animate-bounce text-sm">
              <CheckCircle2 class="w-4 h-4" />
              <span>{toast}</span>
            </div>
          )}

          <header class="bg-gray-950 border-b border-gray-800 p-4 sticky top-0 z-30">
            <div class="flex items-center justify-between">
              <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-amber-500 flex items-center justify-center font-black text-gray-950 text-xl shadow-lg shadow-amber-500/20">MC</div>
                <div>
                  <h1 class="font-extrabold text-base tracking-wider text-amber-500 uppercase">Águias do Asfalto</h1>
                  <p class="text-xs text-gray-400">Portal dos Membros</p>
                </div>
              </div>
              <button onClick={() => setIsAdmin(!isAdmin)} class={`px-3 py-1 rounded-full text-xs font-bold transition flex items-center space-x-1 border ${isAdmin ? 'bg-amber-500/10 text-amber-400 border-amber-500/30' : 'bg-gray-800 text-gray-400 border-gray-700'}`}>
                <Shield class="w-3.5 h-3.5" />
                <span>{isAdmin ? 'Visão Admin' : 'Visão Membro'}</span>
              </button>
            </div>
          </header>

          <main class="p-4 space-y-4">
            {activeTab === 'events' && (
              <div class="space-y-4">
                <div class="flex items-center justify-between">
                  <h2 class="text-lg font-bold text-gray-100 flex items-center space-x-2">
                    <Calendar class="w-5 h-5 text-amber-500" />
                    <span>Mural de Eventos</span>
                  </h2>
                  {isAdmin && (
                    <button onClick={() => setIsAddEventOpen(true)} class="bg-amber-500 hover:bg-amber-400 text-gray-950 px-3 py-1.5 rounded-lg text-xs font-bold flex items-center space-x-1 shadow-md">
                      <Plus class="w-4 h-4" />
                      <span>Novo Evento</span>
                    </button>
                  )}
                </div>

                <div class="flex space-x-2 overflow-x-auto pb-1 text-xs">
                  {['Todos', 'Passeio', 'Reunião', 'Viagem'].map(cat => (
                    <button key={cat} onClick={() => setCategoryFilter(cat)} class={`px-3 py-1.5 rounded-lg whitespace-nowrap font-medium transition ${categoryFilter === cat ? 'bg-amber-500 text-gray-950 font-bold' : 'bg-gray-800 text-gray-400'}`}>{cat}</button>
                  ))}
                </div>

                <div class="space-y-4">
                  {filteredEvents.map(ev => {
                    const isConfirmed = ev.rsvps.includes(currentUserId);
                    return (
                      <div key={ev.id} class="bg-gray-800/60 border border-gray-700/60 rounded-2xl p-4 space-y-3 relative overflow-hidden">
                        {ev.urgent && <div class="absolute top-0 right-0 bg-red-500 text-white text-[10px] font-black px-3 py-0.5 rounded-bl-lg uppercase tracking-wider">Urgente</div>}
                        <div class="flex items-start justify-between pr-12">
                          <span class="text-xs font-bold text-amber-400 bg-amber-500/10 px-2 py-0.5 rounded border border-amber-500/20">{ev.category}</span>
                          <span class="text-xs text-gray-400">{ev.date} às {ev.time}</span>
                        </div>
                        <h3 class="font-bold text-base text-gray-100">{ev.title}</h3>
                        <p class="text-xs text-gray-300 leading-relaxed">{ev.description}</p>
                        <div class="bg-gray-900/60 rounded-xl p-3 space-y-1.5 text-xs border border-gray-800">
                          <div class="flex items-center text-gray-300 space-x-2"><MapPin class="w-3.5 h-3.5 text-amber-500 shrink-0" /><span class="truncate"><strong>Ponto:</strong> {ev.meetingPoint}</span></div>
                          <div class="flex items-center text-gray-300 space-x-2"><Bike class="w-3.5 h-3.5 text-amber-500 shrink-0" /><span class="truncate"><strong>Destino:</strong> {ev.destination}</span></div>
                        </div>
                        <div class="flex items-center justify-between pt-2 border-t border-gray-700/50">
                          <div class="flex items-center space-x-2">
                            <div class="flex -space-x-2">
                              {ev.rsvps.map(id => {
                                const m = members.find(mem => mem.id === id);
                                return m ? <img key={id} src={m.avatar} class="w-6 h-6 rounded-full border-2 border-gray-800 object-cover" title={m.nickname} /> : null;
                              })}
                            </div>
                            <span class="text-xs text-gray-400 font-medium">{ev.rsvps.length} confirmados</span>
                          </div>
                          <button onClick={() => toggleRSVP(ev.id)} class={`px-4 py-2 rounded-xl text-xs font-bold transition flex items-center space-x-1.5 ${isConfirmed ? 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/30' : 'bg-amber-500 hover:bg-amber-400 text-gray-950 shadow-md'}`}>
                            {isConfirmed ? <UserCheck class="w-4 h-4" /> : <Check class="w-4 h-4" />}
                            <span>{isConfirmed ? 'Confirmado' : 'Vou no Trem'}</span>
                          </button>
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            )}

            {activeTab === 'members' && (
              <div class="space-y-4">
                <div class="flex items-center justify-between">
                  <h2 class="text-lg font-bold text-gray-100 flex items-center space-x-2">
                    <Users class="w-5 h-5 text-amber-500" />
                    <span>Membros do Clube</span>
                  </h2>
                  {isAdmin && (
                    <button onClick={() => setIsAddMemberOpen(true)} class="bg-amber-500 hover:bg-amber-400 text-gray-950 px-3 py-1.5 rounded-lg text-xs font-bold flex items-center space-x-1 shadow-md">
                      <Plus class="w-4 h-4" />
                      <span>Novo Membro</span>
                    </button>
                  )}
                </div>

                <div class="relative">
                  <Search class="w-4 h-4 absolute left-3 top-3 text-gray-500" />
                  <input type="text" placeholder="Buscar por nome, apelido ou moto..." value={searchTerm} onChange={e => setSearchTerm(e.target.value)} class="w-full bg-gray-800 border border-gray-700 rounded-xl pl-9 pr-4 py-2 text-xs text-gray-100 focus:outline-none focus:border-amber-500" />
                </div>

                <div class="space-y-3">
                  {filteredMembers.map(m => (
                    <div key={m.id} class="bg-gray-800/60 border border-gray-700/60 rounded-2xl p-3.5 flex items-center space-x-3">
                      <img src={m.avatar} class="w-12 h-12 rounded-xl object-cover border border-amber-500/30 shrink-0" />
                      <div class="flex-1 min-w-0">
                        <div class="flex items-center space-x-2">
                          <h3 class="font-bold text-sm text-gray-100 truncate">{m.name}</h3>
                        </div>
                        <p class="text-xs text-amber-400 font-medium">"{m.nickname}" • <span class="text-gray-300">{m.role}</span></p>
                        <p class="text-[11px] text-gray-400 truncate flex items-center space-x-1 mt-0.5"><Bike class="w-3 h-3 text-gray-500 shrink-0" /><span>{m.bike}</span></p>
                      </div>
                      <a href={`https://wa.me/55${m.phone.replace(/\D/g,'')}`} target="_blank" class="w-9 h-9 rounded-xl bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 flex items-center justify-center shrink-0">
                        <Phone class="w-4 h-4" />
                      </a>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {activeTab === 'notifs' && (
              <div class="space-y-4">
                <div class="flex items-center justify-between">
                  <h2 class="text-lg font-bold text-gray-100 flex items-center space-x-2">
                    <Bell class="w-5 h-5 text-amber-500" />
                    <span>Comunicados</span>
                  </h2>
                  {isAdmin && (
                    <button onClick={() => setIsBroadcastOpen(true)} class="bg-amber-500 hover:bg-amber-400 text-gray-950 px-3 py-1.5 rounded-lg text-xs font-bold flex items-center space-x-1 shadow-md">
                      <Send class="w-4 h-4" />
                      <span>Transmitir Aviso</span>
                    </button>
                  )}
                </div>

                <div class="space-y-3">
                  {notifications.map(n => (
                    <div key={n.id} class="bg-gray-800/60 border border-gray-700/60 rounded-2xl p-4 space-y-2">
                      <div class="flex items-center justify-between">
                        <span class="text-xs font-bold text-amber-400 flex items-center space-x-1">
                          {n.type === 'alert' ? <AlertTriangle class="w-3.5 h-3.5 text-amber-500" /> : <Calendar class="w-3.5 h-3.5 text-amber-500" />}
                          <span>{n.title}</span>
                        </span>
                        <span class="text-[10px] text-gray-500">{n.date}</span>
                      </div>
                      <p class="text-xs text-gray-300 leading-relaxed">{n.message}</p>
                    </div>
                  ))}
                </div>
              </div>
            )}
          </main>

          {isAddMemberOpen && (
            <div class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-end justify-center p-4">
              <div class="bg-gray-900 border border-gray-800 rounded-3xl p-5 w-full max-w-md space-y-4">
                <div class="flex items-center justify-between"><h3 class="font-bold text-base text-gray-100">Cadastrar Novo Membro</h3><button onClick={() => setIsAddMemberOpen(false)} class="text-gray-400"><X class="w-5 h-5" /></button></div>
                <form onSubmit={handleAddMember} class="space-y-3 text-xs">
                  <input type="text" placeholder="Nome Completo *" required value={newMember.name} onChange={e => setNewMember({...newMember, name: e.target.value})} class="w-full bg-gray-800 border border-gray-700 rounded-xl p-3 text-gray-100" />
                  <input type="text" placeholder="Apelido / Vulgo" value={newMember.nickname} onChange={e => setNewMember({...newMember, nickname: e.target.value})} class="w-full bg-gray-800 border border-gray-700 rounded-xl p-3 text-gray-100" />
                  <input type="text" placeholder="Moto (Modelo / Ano)" value={newMember.bike} onChange={e => setNewMember({...newMember, bike: e.target.value})} class="w-full bg-gray-800 border border-gray-700 rounded-xl p-3 text-gray-100" />
                  <input type="text" placeholder="Telefone (com DDD) *" required value={newMember.phone} onChange={e => setNewMember({...newMember, phone: e.target.value})} class="w-full bg-gray-800 border border-gray-700 rounded-xl p-3 text-gray-100" />
                  <button type="submit" class="w-full bg-amber-500 text-gray-950 py-3 rounded-xl font-bold text-sm">Salvar Integrante</button>
                </form>
              </div>
            </div>
          )}

          {isAddEventOpen && (
            <div class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-end justify-center p-4">
              <div class="bg-gray-900 border border-gray-800 rounded-3xl p-5 w-full max-w-md space-y-4">
                <div class="flex items-center justify-between"><h3 class="font-bold text-base text-gray-100">Publicar Novo Evento</h3><button onClick={() => setIsAddEventOpen(false)} class="text-gray-400"><X class="w-5 h-5" /></button></div>
                <form onSubmit={handleAddEvent} class="space-y-3 text-xs">
                  <input type="text" placeholder="Título do Evento *" required value={newEvent.title} onChange={e => setNewEvent({...newEvent, title: e.target.value})} class="w-full bg-gray-800 border border-gray-700 rounded-xl p-3 text-gray-100" />
                  <div class="grid grid-cols-2 gap-2">
                    <input type="date" required value={newEvent.date} onChange={e => setNewEvent({...newEvent, date: e.target.value})} class="bg-gray-800 border border-gray-700 rounded-xl p-3 text-gray-100" />
                    <input type="time" required value={newEvent.time} onChange={e => setNewEvent({...newEvent, time: e.target.value})} class="bg-gray-800 border border-gray-700 rounded-xl p-3 text-gray-100" />
                  </div>
                  <input type="text" placeholder="Ponto de Encontro" value={newEvent.meetingPoint} onChange={e => setNewEvent({...newEvent, meetingPoint: e.target.value})} class="w-full bg-gray-800 border border-gray-700 rounded-xl p-3 text-gray-100" />
                  <input type="text" placeholder="Destino / Cidade" value={newEvent.destination} onChange={e => setNewEvent({...newEvent, destination: e.target.value})} class="w-full bg-gray-800 border border-gray-700 rounded-xl p-3 text-gray-100" />
                  <textarea placeholder="Descrição / Detalhes do trajeto" value={newEvent.description} onChange={e => setNewEvent({...newEvent, description: e.target.value})} class="w-full bg-gray-800 border border-gray-700 rounded-xl p-3 text-gray-100 h-20"></textarea>
                  <button type="submit" class="w-full bg-amber-500 text-gray-950 py-3 rounded-xl font-bold text-sm">Publicar Evento</button>
                </form>
              </div>
            </div>
          )}

          {isBroadcastOpen && (
            <div class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-end justify-center p-4">
              <div class="bg-gray-900 border border-gray-800 rounded-3xl p-5 w-full max-w-md space-y-4">
                <div class="flex items-center justify-between"><h3 class="font-bold text-base text-gray-100">Transmitir Aviso Oficial</h3><button onClick={() => setIsBroadcastOpen(false)} class="text-gray-400"><X class="w-5 h-5" /></button></div>
                <form onSubmit={handleSendBroadcast} class="space-y-3 text-xs">
                  <input type="text" placeholder="Título do Comunicado *" required value={broadcastMsg.title} onChange={e => setBroadcastMsg({...broadcastMsg, title: e.target.value})} class="w-full bg-gray-800 border border-gray-700 rounded-xl p-3 text-gray-100" />
                  <textarea placeholder="Mensagem para todos os membros *" required value={broadcastMsg.message} onChange={e => setBroadcastMsg({...broadcastMsg, message: e.target.value})} class="w-full bg-gray-800 border border-gray-700 rounded-xl p-3 text-gray-100 h-24"></textarea>
                  <button type="submit" class="w-full bg-amber-500 text-gray-950 py-3 rounded-xl font-bold text-sm">Enviar Comunicado</button>
                </form>
              </div>
            </div>
          )}

          <nav class="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-md bg-gray-950/95 backdrop-blur-md border-t border-gray-800 px-6 py-3 flex justify-around items-center z-40">
            <button onClick={() => setActiveTab('events')} class={`flex flex-col items-center space-y-1 ${activeTab === 'events' ? 'text-amber-500' : 'text-gray-500'}`}>
              <Calendar class="w-5 h-5" />
              <span class="text-[10px] font-bold">Eventos</span>
            </button>
            <button onClick={() => setActiveTab('members')} class={`flex flex-col items-center space-y-1 ${activeTab === 'members' ? 'text-amber-500' : 'text-gray-500'}`}>
              <Users class="w-5 h-5" />
              <span class="text-[10px] font-bold">Membros</span>
            </button>
            <button onClick={() => setActiveTab('notifs')} class={`flex flex-col items-center space-y-1 ${activeTab === 'notifs' ? 'text-amber-500' : 'text-gray-500'}`}>
              <Bell class="w-5 h-5" />
              <span class="text-[10px] font-bold">Avisos</span>
            </button>
          </nav>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
